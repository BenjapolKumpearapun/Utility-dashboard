<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Performance Smart Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #020617;
            --bg-secondary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.45);
            --border-card: rgba(255, 255, 255, 0.06);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --cooling-primary: #3b82f6;
            --cooling-glow: rgba(59, 130, 246, 0.15);
            --air-primary: #10b981;
            --air-glow: rgba(16, 185, 129, 0.15);
            --refrig-primary: #f59e0b;
            --refrig-glow: rgba(245, 158, 11, 0.15);
            
            --accent-active: var(--cooling-primary);
            --accent-glow: var(--cooling-glow);
            
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-card: rgba(248, 250, 252, 0.8);
            --border-card: rgba(15, 23, 42, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --cooling-primary: #2563eb;
            --cooling-glow: rgba(37, 99, 235, 0.1);
            --air-primary: #059669;
            --air-glow: rgba(5, 150, 105, 0.1);
            --refrig-primary: #d97706;
            --refrig-glow: rgba(217, 119, 6, 0.1);
            
            --card-shadow: 0 4px 20px 0 rgba(15, 23, 42, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            background-image: radial-gradient(circle at top left, var(--bg-secondary) 0%, var(--bg-primary) 80%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            transition: background-color 0.5s ease;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-card);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-card);
        }

        .brand i {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.6rem;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            width: 100%;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            transform: translateX(4px);
        }

        .nav-link.active[data-target="cooling_pump"] {
            background: var(--cooling-glow);
            color: var(--cooling-primary);
            border-color: rgba(59, 130, 246, 0.2);
            font-weight: 600;
        }

        .nav-link.active[data-target="plant_air"] {
            background: var(--air-glow);
            color: var(--air-primary);
            border-color: rgba(16, 185, 129, 0.2);
            font-weight: 600;
        }

        .nav-link.active[data-target="refrig_unit"] {
            background: var(--refrig-glow);
            color: var(--refrig-primary);
            border-color: rgba(245, 158, 11, 0.2);
            font-weight: 600;
        }

        .sidebar-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Theme Toggle */
        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-card);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Main Content Container */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .controls-panel {
            display: flex;
            align-items: center;
            gap: 24px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid var(--border-card);
            box-shadow: var(--card-shadow);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .styled-select {
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-primary);
            border: 1px solid var(--border-card);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            min-width: 150px;
            transition: var(--transition);
        }

        .styled-select:hover {
            border-color: var(--accent-active);
        }

        /* Slider Panel */
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rate-slider {
            -webkit-appearance: none;
            width: 150px;
            height: 6px;
            border-radius: 5px;
            background: var(--border-card);
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .rate-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-active);
            box-shadow: 0 0 10px var(--accent-active);
            cursor: pointer;
            transition: var(--transition);
        }

        .rate-value {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: var(--text-primary);
            min-width: 80px;
        }

        /* Dynamic Grid Layout */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-active);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-icon-bg {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-active);
            font-size: 1.1rem;
        }

        .card-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
            margin-top: 5px;
        }

        .card-subtext {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Recommendation Banner */
        .recommendation-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(59, 130, 246, 0.08) 100%);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .recommendation-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(to bottom, #10b981, #3b82f6);
        }

        .rec-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #10b981;
        }

        .rec-header i {
            font-size: 1.5rem;
            animation: pulse 2s infinite;
        }

        .rec-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .rec-body strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .rec-savings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .rec-saving-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .rec-saving-card label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .rec-saving-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #10b981;
        }

        /* Chart Grid Layout */
        .chart-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 380px;
        }

        .chart-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chart-canvas-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Table Card Styling */
        .table-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .table-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-card);
        }

        .styled-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .styled-table th {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 14px 18px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-card);
        }

        .styled-table td {
            padding: 14px 18px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-card);
            transition: var(--transition);
        }

        .styled-table tbody tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
        }

        .styled-table tr:last-child td {
            border-bottom: none;
        }

        .highlight-text {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Utility classes */
        .flex-row-center {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-card);
                padding: 20px;
                gap: 15px;
            }
            .sidebar-footer {
                display: none;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .controls-panel {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
        }
    </style>
</head>

        let activeEquipment = 'cooling_pump';

        let trendChartInstance = null;

        // DOM elements
        const navLinks = document.querySelectorAll('.nav-link');
        const monthSelect = document.getElementById('month-select');
        const costSlider = document.getElementById('cost-slider');
        const rateValText = document.getElementById('rate-val');
        const pageTitle = document.getElementById('page-title');
        const pageSubtitle = document.getElementById('page-subtitle');
        const rateControlGroup = document.getElementById('rate-control-group');
        const themeToggle = document.getElementById('theme-toggle');
        const themeText = document.getElementById('theme-text');
        const themeIcon = themeToggle.querySelector('i');

        // Initial setup
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            renderDashboard();
        });

        function setupEventListeners() {
            // Sidebar Navigation
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    navLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    activeEquipment = link.getAttribute('data-target');
                    
                    // Update layout theme properties
                    const root = document.documentElement;
                    if (activeEquipment === 'cooling_pump') {
                        root.style.setProperty('--accent-active', 'var(--cooling-primary)');
                        root.style.setProperty('--accent-glow', 'var(--cooling-glow)');
                        pageTitle.textContent = "Cooling Pump Performance";
                        pageSubtitle.textContent = "Analysis and optimization opportunities for cooling water pumps.";
                        rateControlGroup.style.display = 'flex';
                    } else if (activeEquipment === 'plant_air') {
                        root.style.setProperty('--accent-active', 'var(--air-primary)');
                        root.style.setProperty('--accent-glow', 'var(--air-glow)');
                        pageTitle.textContent = "Plant Air Performance";
                        pageSubtitle.textContent = "Analysis and optimization opportunities for plant utility compressed air.";
                        rateControlGroup.style.display = 'flex';
                    } else {
                        root.style.setProperty('--accent-active', 'var(--refrig-primary)');
                        root.style.setProperty('--accent-glow', 'var(--refrig-glow)');
                        pageTitle.textContent = "Refrigeration Unit Performance";
                        pageSubtitle.textContent = "Performance analysis of chiller and refrigeration equipment.";
                        rateControlGroup.style.display = 'none'; // Refrig unit doesn't calculate savings in this dashboard
                    }

                    renderDashboard();
                });
            });

            // Month Select
            monthSelect.addEventListener('change', (e) => {
                activeMonth = e.target.value;
                renderDashboard();
            });

            // Cost Slider
            costSlider.addEventListener('input', (e) => {
                electricityRate = parseFloat(e.target.value);
                rateValText.textContent = electricityRate.toFixed(1) + " THB/kWh";
                updateDynamicSavings();
            });

            // Light/Dark Theme Toggle
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.body.getAttribute('data-theme');
                if (currentTheme === 'light') {
                    document.body.removeAttribute('data-theme');
                    themeText.textContent = "Light Mode";
                    themeIcon.className = "fa-solid fa-sun";
                } else {
                    document.body.setAttribute('data-theme', 'light');
                    themeText.textContent = "Dark Mode";
                    themeIcon.className = "fa-solid fa-moon";
                }
                renderCharts(); // Redraw charts with correct styling colors
            });
        }

        function getChartColors() {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            return {
                text: isLight ? '#475569' : '#94a3b8',
                grid: isLight ? 'rgba(15, 23, 42, 0.05)' : 'rgba(255, 255, 255, 0.05)',
                cardBg: isLight ? '#f8fafc' : '#1e293b'
            };
        }

        function renderDashboard() {
            renderKPIs();
            renderRecommendations();
            renderCharts();
            renderTable();
        }

        function renderKPIs() {
            const kpiContainer = document.getElementById('kpi-container');
            const data = DASHBOARD_DATA[activeMonth][activeEquipment];
            kpiContainer.innerHTML = '';

            if (!data) {
                kpiContainer.innerHTML = `

                    </div>`;
                return;
            }

            if (activeEquipment === 'cooling_pump') {
                // Card 1: Power
                kpiContainer.appendChild(createKPICard(
                    'Average Power',

                    'fa-solid fa-bolt', 
                    'Combined average electrical power'
                ));

                kpiContainer.appendChild(createKPICard(

                    (data.avg_eff * 100).toFixed(2) + ' %', 
                    'fa-solid fa-gauge-high',

                ));

        function createKPICard(title, value, iconClass, subtext, customClass = '') {
            const card = document.createElement('div');
            card.className = `card ${customClass}`;
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${title}</span>
                    <div class="card-icon-bg">
                        <i class="${iconClass}"></i>
                    </div>
                </div>
                <div class="card-value">${value}</div>
                <div class="card-subtext">${subtext}</div>
            `;
            return card;
        }

                        จากการวิเคราะห์ข้อมูลกลุ่ม Cooling Pump พบว่าการเดินปั๊มแบบคู่ <strong>AB มีประสิทธิภาพเฉลี่ยสูงที่สุด (${(0.8831 * 100).toFixed(2)}%)</strong> 
                        และประหยัดพลังงานมากที่สุด เมื่อเปรียบเทียบกับการเดินคู่อื่น (เช่น AC ที่มีประสิทธิภาพ 85.90% หรือ BC ที่มีประสิทธิภาพ 86.92%)
                        <br><br>
                        ${isOptimal ? 
                            `<strong>status ปัจจุบันในเดือนนี้:</strong> คุณได้ใช้การรันปั๊มคู่ <strong>AB</strong> เป็นหลักเรียบร้อยแล้ว (ยอดเยี่ยม!)` : 
                            `<strong>ข้อแนะนำในเดือนนี้:</strong> มีการเดินปั๊มคู่ <strong>${data.run_config}</strong> ซึ่งมีประสิทธิภาพต่ำกว่า หากเปลี่ยนมาเดินปั๊มคู่ <strong>AB</strong> จะช่วยลดกำลังไฟฟ้าลงได้เฉลี่ยประมาณ 18-32 kW ณ โหลดการใช้งานเดิม`
                        }
                    </div>
                    <div class="rec-savings-grid">
                        <div class="rec-saving-card">
                            <label>เดือนนี้ประหยัดได้ (Potential Monthly Saving)</label>
                            <div class="rec-saving-val"><span id="rec-monthly-saving-cost">${formatNumber(monthlySavingsCost)}</span> THB</div>
                            <div class="card-subtext">ประหยัดพลังงาน ${formatNumber(monthlySavingsKwh.toFixed(0))} kWh</div>
                        </div>
                        <div class="rec-saving-card">
                            <label>โครงการประหยัดต่อปี (Est. Annual Saving)</label>
                            <div class="rec-saving-val" style="color: #3b82f6;"><span id="rec-annual-saving-cost">${formatNumber(annualSavingsCost)}</span> THB/year</div>
                            <div class="card-subtext">ประหยัดพลังงานสะสม ~${formatNumber(annualSavingsKwh.toFixed(0))} kWh/year</div>
                        </div>
                    </div>
                `;
            } else if (activeEquipment === 'plant_air') {
                const isOptimal = data.run_config === 'A';
                const monthlySavingsKwh = data.saving_kwh;
                const monthlySavingsCost = monthlySavingsKwh * electricityRate;

                let total7MonthSavingsKwh = 0;
                for (const m in DASHBOARD_DATA) {
                    const pa = DASHBOARD_DATA[m].plant_air;
                    if (pa) total7MonthSavingsKwh += pa.saving_kwh;
                }
                const annualSavingsKwh = total7MonthSavingsKwh * (12 / 7);
                const annualSavingsCost = annualSavingsKwh * electricityRate;

                recHtml = `
                    <div class="rec-header">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>ข้อเสนอแนะด้านการประหยัดพลังงาน (Plant Air Optimization)</span>
                    </div>
                    <div class="rec-body">
                        จากการวิเคราะห์ข้อมูลกลุ่ม Plant Air พบว่าเครื่อง <strong>A มีประสิทธิภาพเฉลี่ยสูงที่สุด (${(0.7248 * 100).toFixed(2)}%)</strong> 
                        และกินไฟฟ้าน้อยกว่าการรันเครื่อง B (เครื่อง B กินไฟฟ้าเฉลี่ย 261.70 kW ประสิทธิภาพเฉลี่ย 68.88% แม้ที่ระดับ flow ที่ต่ำกว่าเครื่อง A)
                        <br><br>
                        ${isOptimal ? 
                            `<strong>status ปัจจุบันในเดือนนี้:</strong> คุณได้รันเครื่อง <strong>A</strong> เป็นหลักเรียบร้อยแล้ว` : 
                            `<strong>ข้อแนะนำในเดือนนี้:</strong> โรงงานเดินเครื่อง <strong>B</strong> เป็นหลัก ซึ่งกินไฟสูงกว่า หากเปลี่ยนมาสลับเดินเครื่อง <strong>A</strong> แทนเป็นหลัก จะสามารถประหยัดพลังงานไฟฟ้าลงได้ประมาณ 13 kW ต่อชั่วโมงในการทำงาน`
                        }
                    </div>
                    <div class="rec-savings-grid">
                        <div class="rec-saving-card">
                            <label>เดือนนี้ประหยัดได้ (Potential Monthly Saving)</label>
                            <div class="rec-saving-val"><span id="rec-monthly-saving-cost">${formatNumber(monthlySavingsCost)}</span> THB</div>
                            <div class="card-subtext">ประหยัดพลังงาน ${formatNumber(monthlySavingsKwh.toFixed(0))} kWh</div>
                        </div>
                        <div class="rec-saving-card">
                            <label>โครงการประหยัดต่อปี (Est. Annual Saving)</label>
                            <div class="rec-saving-val" style="color: #10b981;"><span id="rec-annual-saving-cost">${formatNumber(annualSavingsCost)}</span> THB/year</div>
                            <div class="card-subtext">ประหยัดพลังงานสะสม ~${formatNumber(annualSavingsKwh.toFixed(0))} kWh/year</div>
                        </div>
                    </div>
                `;
            }
            
            recContainer.innerHTML = recHtml;
        }

        // Fast update when cost slider is moved
        function updateDynamicSavings() {
            if (activeEquipment === 'refrig_unit') return;
            const data = DASHBOARD_DATA[activeMonth][activeEquipment];
            if (!data) return;

            // 1. Update Monthly KPI Cost
            const savingCostVal = data.saving_kwh * electricityRate;
            const savingsKpi = document.querySelector('.savings-card .card-value');
            if (savingsKpi) {
                savingsKpi.innerHTML = `<span>${formatNumber(savingCostVal)}</span> THB`;
            }

            // 2. Update Recommendation costs
            const monthlySavingPlaceholder = document.getElementById('rec-monthly-saving-cost');
            const annualSavingPlaceholder = document.getElementById('rec-annual-saving-cost');
            
            if (monthlySavingPlaceholder && annualSavingPlaceholder) {
                monthlySavingPlaceholder.textContent = formatNumber(data.saving_kwh * electricityRate);
                
                // Recalculate annual projected savings
                let total7MonthSavingsKwh = 0;
                for (const m in DASHBOARD_DATA) {
                    const eqData = DASHBOARD_DATA[m][activeEquipment];
                    if (eqData) total7MonthSavingsKwh += eqData.saving_kwh;
                }
                const annualSavingsKwh = total7MonthSavingsKwh * (12 / 7);
                annualSavingPlaceholder.textContent = formatNumber(annualSavingsKwh * electricityRate);
            }
        }

        function renderCharts() {
            // Destroy existing chart instances to avoid overlap/memory leak
            if (trendChartInstance) trendChartInstance.destroy();
            if (breakdownChartInstance) breakdownChartInstance.destroy();

            const data = DASHBOARD_DATA[activeMonth][activeEquipment];
            const breakdownCard = document.getElementById('breakdown-chart-card');
            
            if (!data) {
                breakdownCard.style.display = 'none';
                return;
            }

            const colors = getChartColors();
            Chart.defaults.color = colors.text;
            Chart.defaults.borderColor = colors.grid;

            // Get active months keys
            const activeMonths = Object.keys(DASHBOARD_DATA).filter(m => DASHBOARD_DATA[m][activeEquipment] !== null);

            // 1. RENDER TREND CHART (Line Chart)
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            const trendTitle = document.getElementById('trend-chart-title');

            if (activeEquipment === 'cooling_pump') {
                trendTitle.textContent = "Monthly Power & Efficiency Trend (Cooling Pump)";
                const powers = activeMonths.map(m => DASHBOARD_DATA[m].cooling_pump.avg_power);
                const effs = activeMonths.map(m => DASHBOARD_DATA[m].cooling_pump.avg_eff * 100);

                trendChartInstance = new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: activeMonths.map(m => formatMonthLabel(m)),
                        datasets: [
                            {
                                label: 'Avg Power (kW)',
                                data: powers,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                yAxisID: 'yPower',
                                tension: 0.3,
                                fill: true
                            },
                            {
                                label: 'Avg Efficiency (%)',
                                data: effs,
                                borderColor: '#10b981',
                                backgroundColor: 'transparent',
                                yAxisID: 'yEff',
                                tension: 0.3,
                                borderDash: [5, 5]
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            yPower: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Power (kW)' },
                                min: 1000,
                                max: 1300
                            },
                            yEff: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: 'Efficiency (%)' },
                                min: 80,
                                max: 92,
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                });
            } else if (activeEquipment === 'plant_air') {
                trendTitle.textContent = "Monthly Power & Efficiency Trend (Plant Air)";
                const powers = activeMonths.map(m => DASHBOARD_DATA[m].plant_air.avg_power);
                const effs = activeMonths.map(m => DASHBOARD_DATA[m].plant_air.avg_eff * 100);

                trendChartInstance = new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: activeMonths.map(m => formatMonthLabel(m)),
                        datasets: [
                            {
                                label: 'Avg Power (kW)',
                                data: powers,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                yAxisID: 'yPower',
                                tension: 0.3,
                                fill: true
                            },
                            {
                                label: 'Avg Efficiency (%)',
                                data: effs,
                                borderColor: '#3b82f6',
                                backgroundColor: 'transparent',
                                yAxisID: 'yEff',
                                tension: 0.3,
                                borderDash: [5, 5]
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            yPower: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Power (kW)' },
                                min: 200,
                                max: 300
                            },
                            yEff: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: 'Efficiency (%)' },
                                min: 60,
                                max: 80,
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                });
            } else if (activeEquipment === 'refrig_unit') {
                trendTitle.textContent = "Monthly Power & COP Trend (Refrig. Unit)";
                const elecPowers = activeMonths.map(m => DASHBOARD_DATA[m].refrig_unit.avg_power);
                const coolingPowers = activeMonths.map(m => DASHBOARD_DATA[m].refrig_unit.avg_cooling_power);
                const cops = activeMonths.map(m => DASHBOARD_DATA[m].refrig_unit.avg_cop);

                trendChartInstance = new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: activeMonths.map(m => formatMonthLabel(m)),
                        datasets: [
                            {
                                label: 'Electrical Power (kW)',
                                data: elecPowers,
                                borderColor: '#f59e0b',
                                backgroundColor: 'transparent',
                                yAxisID: 'yPower',
                                tension: 0.3
                            },
                            {
                                label: 'Cooling Power (kW)',
                                data: coolingPowers,
                                borderColor: '#ef4444',
                                backgroundColor: 'transparent',
                                yAxisID: 'yPower',
                                tension: 0.3
                            },
                            {
                                label: 'COP',
                                data: cops,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.05)',
                                yAxisID: 'yCop',
                                tension: 0.3,
                                fill: true,
                                borderDash: [5, 5]
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            yPower: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: { display: true, text: 'Power (kW)' },
                                min: 100,
                                max: 1200
                            },
                            yCop: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: { display: true, text: 'COP' },
                                min: 3.0,
                                max: 4.5,
                                grid: { drawOnChartArea: false }
                            }
                        }
                    }
                });
            }

            // 2. RENDER BREAKDOWN CHART (Doughnut Chart)
            if (activeEquipment === 'refrig_unit') {
                breakdownCard.style.display = 'none';
            } else {
                breakdownCard.style.display = 'flex';
                const breakdownCtx = document.getElementById('breakdownChart').getContext('2d');
                
                // Get config percentage share data
                const configPct = data.conf_pct;
                const labels = Object.keys(configPct).filter(c => c !== 'None');
                const shares = labels.map(c => configPct[c]);
                
                // Colors based on active theme
                const chartColors = activeEquipment === 'cooling_pump' 
                    ? ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'] 
                    : ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'];

                breakdownChartInstance = new Chart(breakdownCtx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: shares,
                            backgroundColor: chartColors,
                            borderColor: colors.cardBg,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { padding: 15 }
                            }
                        },
                        cutout: '65%'
                    }
                });
            }
        }

        function renderTable() {
            const tableElement = document.getElementById('data-table');
            const tableTitle = document.getElementById('table-card-title');
            const data = DASHBOARD_DATA[activeMonth][activeEquipment];
            
            tableElement.innerHTML = '';

            if (!data) return;

            if (activeEquipment === 'cooling_pump') {
                tableTitle.textContent = `Pumps Configuration Breakdown - ${formatMonthLabel(activeMonth)}`;
                tableElement.innerHTML = `
                    <thead>
                        <tr>
                            <th>Configuration (การทำงานปั๊ม)</th>
                            <th>Active Hours (จำนวนชั่วโมง)</th>
                            <th>Runtime Share (%)</th>
                            <th>Avg Power (kW)</th>
                            <th>Avg Efficiency (%)</th>
                            <th>Avg Flow (m³/h)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Object.keys(data.breakdown).map(cfg => {
                            const c = data.breakdown[cfg];
                            const share = data.conf_pct[cfg] || 0;
                            const isOpt = cfg === 'AB' ? 'style="color:#10b981;font-weight:600;"' : '';
                            return `
                                <tr>
                                    <td class="highlight-text" ${isOpt}>${cfg} ${cfg === 'AB' ? ' (Recommended <i class="fa-solid fa-star"></i>)' : ''}</td>
                                    <td>${c.hours} hrs</td>
                                    <td>${share.toFixed(1)}%</td>
                                    <td>${c.avg_power.toFixed(1)} kW</td>
                                    <td>${(c.avg_eff * 100).toFixed(2)}%</td>
                                    <td>${formatNumber(c.avg_flow.toFixed(0))} m³/h</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                `;
            } else if (activeEquipment === 'plant_air') {
                tableTitle.textContent = `Compressors Configuration Breakdown - ${formatMonthLabel(activeMonth)}`;
                tableElement.innerHTML = `
                    <thead>
                        <tr>
                            <th>Configuration (การทำงานเครื่อง)</th>
                            <th>Active Hours (จำนวนชั่วโมง)</th>
                            <th>Runtime Share (%)</th>
                            <th>Avg Power (kW)</th>
                            <th>Avg Efficiency (%)</th>
                            <th>Avg Flow (Nm³/min)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Object.keys(data.breakdown).map(cfg => {
                            const c = data.breakdown[cfg];
                            const share = data.conf_pct[cfg] || 0;
                            const isOpt = cfg === 'A' ? 'style="color:#10b981;font-weight:600;"' : '';
                            return `
                                <tr>
                                    <td class="highlight-text" ${isOpt}>${cfg} ${cfg === 'A' ? ' (Recommended <i class="fa-solid fa-star"></i>)' : ''}</td>
                                    <td>${c.hours} hrs</td>
                                    <td>${share.toFixed(1)}%</td>
                                    <td>${c.avg_power.toFixed(1)} kW</td>
                                    <td>${(c.avg_eff * 100).toFixed(2)}%</td>
                                    <td>${formatNumber((c.avg_flow / 60).toFixed(1))} Nm³/min</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                `;
            } else if (activeEquipment === 'refrig_unit') {
                tableTitle.textContent = `Monthly Historic Summary - Refrigeration Unit`;
                // Show historical monthly data in table for comparison
                const monthsList = Object.keys(DASHBOARD_DATA).filter(m => DASHBOARD_DATA[m].refrig_unit !== null);
                tableElement.innerHTML = `
                    <thead>
                        <tr>
                            <th>Month (เดือน)</th>
                            <th>Active Hours (ชั่วโมงการทำงาน)</th>
                            <th>Avg Elec Power (kW)</th>
                            <th>Avg Cooling Power (kW)</th>
                            <th>Avg COP</th>
                            <th>Refrig. Ton (RT)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${monthsList.map(m => {
                            const row = DASHBOARD_DATA[m].refrig_unit;
                            const highlight = m === activeMonth ? 'style="background:rgba(255,255,255,0.04); font-weight:600;"' : '';
                            // 1 RT = 3.517 kW of cooling power
                            const rt = row.avg_cooling_power / 3.517;
                            return `
                                <tr ${highlight}>
                                    <td class="highlight-text">${formatMonthLabel(m)} ${m === activeMonth ? ' (Selected)' : ''}</td>
                                    <td>${row.active_hours} hrs</td>
                                    <td>${row.avg_power.toFixed(1)} kW</td>
                                    <td>${row.avg_cooling_power.toFixed(1)} kW</td>
                                    <td>${row.avg_cop.toFixed(3)}</td>
                                    <td>${rt.toFixed(1)} RT</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                `;
            }
        }

        // Helper: format 2026-01 to "January 2026"
        function formatMonthLabel(mStr) {
            const parts = mStr.split('-');
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return months[parseInt(parts[1]) - 1] + ' ' + parts[0];
        }

        // Helper: format numbers with comma separator
        function formatNumber(num) {
            const parts = parseFloat(num).toFixed(0).toString().split(".");
            parts[0] = parts[0].replace(/\B(?=(\d){3})+(?!\d)/g, ",");
            return parts.join(".");
        }
    </script>
</body>
</html>
